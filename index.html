<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portofolio Kelas X-B</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">

    <header>
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-text">Divisi Programming</span>
        <span class="brand-sub">/ tim tiga orang</span>
      </div>
      <div class="status-pill">
        <span class="pulse"></span>
        Online | Available for learning
      </div>
    </header>

    <main>
      <div class="stack-col">
        <div class="stack" id="stack">
          <button class="nav-arrow left" id="prevBtn" aria-label="Profil sebelumnya">&lsaquo;</button>
          <button class="nav-arrow right" id="nextBtn" aria-label="Profil berikutnya">&rsaquo;</button>
        </div>
        <div class="dots" id="dots"></div>
      </div>

      <div class="panel">
        <div class="tabs" id="tabs"></div>
        <div class="content-slide" id="content"></div>
      </div>
    </main>

    <footer>&copy; 2026 &mdash; dibuat oleh Kelompok 6</footer>
  </div>

  <!-- Spotify-style player bar (muncul kalau ada track aktif) -->
  <div class="sp-player" id="spPlayer">
    <div class="sp-player-left">
      <div class="sp-player-art" id="spPlayerArt">♪</div>
      <div class="sp-player-info">
        <div class="sp-player-title" id="spPlayerTitle">—</div>
        <div class="sp-player-artist" id="spPlayerArtist">—</div>
      </div>
    </div>
    <div class="sp-player-center">
      <div class="sp-player-controls">
        <button id="spShuffleBtn" title="Shuffle">⇄</button>
        <button id="spPrevBtn" title="Previous">⏮</button>
        <button class="play" id="spPlayBtn" title="Play/Pause">▶</button>
        <button id="spNextBtn" title="Next">⏭</button>
        <button id="spRepeatBtn" title="Repeat">↻</button>
      </div>
      <div class="sp-player-progress">
        <span id="spCurrent">0:00</span>
        <div class="sp-bar-progress" id="spProgressBar">
          <div class="sp-bar-fill" id="spProgressFill"></div>
        </div>
        <span id="spDuration">0:00</span>
      </div>
    </div>
    <div class="sp-player-right">
      <button class="sp-vol-btn" id="spMuteBtn" title="Mute">🔊</button>
      <input type="range" class="sp-vol-slider" id="spVolSlider" min="0" max="1" step="0.01" value="0.7">
      <button class="sp-close-player" id="spClosePlayer" title="Tutup player">✕</button>
    </div>
  </div>

  <audio id="spAudio"></audio>

  <div class="toast" id="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
